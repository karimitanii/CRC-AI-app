nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: false
  name: clusterops-assistant

backend:
  replicaCount: 1
  image:
    repository: quay.io/your-org/clusterops-backend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 4111
  service:
    type: ClusterIP
    port: 4111
  route:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 5
  env:
    HOST: 0.0.0.0
    HOME: /tmp
    XDG_CONFIG_HOME: /tmp/.config
    CLUSTEROPS_KUBE_MODE: incluster
    CLUSTEROPS_DEFAULT_NAMESPACE: clusterops-ai
    CLUSTEROPS_NAMESPACE_ALLOWLIST: clusterops-ai
    CLUSTEROPS_LOG_TAIL_LINES: "200"
    COPILOTKIT_CHAT_PATH: /chat
    COPILOTKIT_ALLOWED_ORIGINS: ""
  secretRefs:
    - clusterops-backend-secrets

frontend:
  replicaCount: 1
  image:
    repository: quay.io/your-org/clusterops-frontend
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
  route:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 5
  env:
    NEXT_PUBLIC_APP_NAME: ClusterOps Assistant
    NEXT_PUBLIC_COPILOTKIT_RUNTIME_URL: /api/copilotkit
    NEXT_PUBLIC_COPILOTKIT_AGENT: clusterops-agent
    AUTH_COOKIE_NAME: clusterops_session
    MASTRA_BASE_URL: ""
  secretRefs: []
